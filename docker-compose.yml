networks:
  allin1_network:
    driver: bridge

services:
  # ==========================================
  # Bases de datos PostgreSQL
  # ==========================================

  postgres_iam:
    image: postgres:16-alpine
    container_name: postgres_iam
    ports:
      - "5433:5432" # Puerto host 5433 -> Puerto interno 5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_IAM}
      POSTGRES_DB: iam_db
    volumes:
      - iam_db_data:/var/lib/postgresql/data
    networks:
      - allin1_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_catalog:
    image: postgres:16-alpine
    container_name: postgres_catalog
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CATALOG}
      POSTGRES_DB: catalog_db
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    networks:
      - allin1_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Microservicios de Backend (Go)
  # ==========================================

  # Cada microservicio expone gRPC en 50051 (interno) y REST vía gRPC-Gateway
  # en 8080 (interno), mapeado a un puerto host distinto.

  iam:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: cmd/iam
    container_name: iam
    depends_on:
      postgres_iam:
        condition: service_healthy
    environment:
      DB_HOST: postgres_iam
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD_IAM}
      DB_NAME: iam_db
      DB_SSLMODE: disable
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
    ports:
      - "8081:8080"
    networks:
      - allin1_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080" ]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: cmd/catalog
    container_name: catalog
    depends_on:
      postgres_catalog:
        condition: service_healthy
    environment:
      DB_HOST: postgres_catalog
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD_CATALOG}
      DB_NAME: catalog_db
      DB_SSLMODE: disable
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
    ports:
      - "8082:8080"
    networks:
      - allin1_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # (NestJS API Gateway removido)
  # El backend NestJS (backend-microservices/) fue descartado; se usa exclusivamente backend-go/.
  # ==========================================

  # ==========================================
  # Frontend Next.js (frontend-marketplace)
  # ==========================================

  # El cliente web de la aplicación.
  # Expone el puerto 3000 para poder acceder a la interfaz desde el navegador.
  frontend-marketplace:
    build:
      context: ./frontend-marketplace
      dockerfile: Dockerfile
    container_name: frontend-marketplace
    ports:
      - "3000:3000"
    networks:
      - allin1_network

# Definimos los volúmenes nombrados para la persistencia de datos de PostgreSQL
volumes:
  iam_db_data:
  catalog_db_data:
