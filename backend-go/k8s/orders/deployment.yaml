# ==============================================================================
# Deployment: orders
# ==============================================================================
# Despliega el microservicio Orders (Órdenes) en Go.
# Expone gRPC en el puerto 50053 y la API REST vía gRPC-Gateway en el puerto 8084.
#
# DEPENDENCIAS PENDIENTES (otros tickets):
#   - ConfigMap orders-db-config (DB_HOST=postgres-orders, DB_PORT=5432,
#     GRPC_PORT=50053, HTTP_PORT=8084)
#   - Secret orders-db-secret (DB_USER, DB_PASSWORD, DB_NAME, DB_SSLMODE)
#   - PostgreSQL postgres-orders
# No aplicar con kubectl apply hasta que existan y la imagen tenga tag real.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: student-aalarcon
  labels:
    app: orders
    project: allin1
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
      project: allin1
  template:
    metadata:
      labels:
        app: orders
        project: allin1
        tier: backend
    spec:
      containers:
        - name: orders
          # Reemplazar TAG_A_DEFINIR por el tag real al construir la imagen.
          # Formato YYYYMMDD-<hash-corto-git> (nunca latest)
          image: am4roo/allin1-orders-go:TAG_A_DEFINIR
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http-gateway
              protocol: TCP
            - containerPort: 50053
              name: grpc
              protocol: TCP
          env:
            # ---------------------------------------------------------------
            # Variables no sensibles (ConfigMap orders-db-config)
            # ---------------------------------------------------------------
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: orders-db-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: orders-db-config
                  key: DB_PORT
            - name: GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: orders-db-config
                  key: GRPC_PORT
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: orders-db-config
                  key: HTTP_PORT

            # ---------------------------------------------------------------
            # Variables sensibles de BD (Secret orders-db-secret)
            # ---------------------------------------------------------------
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: DB_NAME
            - name: DB_SSLMODE
              valueFrom:
                secretKeyRef:
                  name: orders-db-secret
                  key: DB_SSLMODE

            # ---------------------------------------------------------------
            # JWT_SECRET (referencia centralizada desde iam-db-secret)
            # ---------------------------------------------------------------
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iam-db-secret
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "100m"       # >= 25m requerido por LimitRange
              memory: "128Mi"   # >= 64Mi requerido por LimitRange
            limits:
              cpu: "250m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
