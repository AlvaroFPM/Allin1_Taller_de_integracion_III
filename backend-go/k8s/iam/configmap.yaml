# ==============================================================================
# ConfigMap: iam-db-config
# ==============================================================================
# Contiene las variables de entorno NO sensibles para la conexión a la
# base de datos. Estas se inyectan al Deployment de IAM como variables
# de entorno del contenedor.
#
# A diferencia del Secret, estos valores no requieren codificación base64
# y pueden almacenarse en texto plano de forma segura.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  # Nombre del ConfigMap — referenciado desde el Deployment
  name: iam-db-config
  # Namespace asignado al equipo en el cluster universitario
  namespace: student-aalarcon
  labels:
    # Labels consistentes con el resto de recursos del proyecto
    app: iam
    project: allin1
data:
  # -----------------------------------------------------------------------
  # DB_HOST: Host de la base de datos PostgreSQL.
  #
  # Apunta al Service headless "postgres-iam" del StatefulSet de PostgreSQL
  # desplegado en el mismo namespace (student-aalarcon). Kubernetes resuelve
  # este nombre automáticamente vía DNS interno del cluster:
  #   postgres-iam → postgres-iam.student-aalarcon.svc.cluster.local
  #
  # El StatefulSet y su Service están definidos en postgres-iam.yaml.
  # -----------------------------------------------------------------------
  DB_HOST: "postgres-iam"

  # DB_PORT: Puerto estándar de PostgreSQL (5432)
  DB_PORT: "5432"
