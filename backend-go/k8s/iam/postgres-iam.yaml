apiVersion: v1
kind: Secret
metadata:
  name: postgres-iam-secret
  namespace: student-aalarcon
  labels:
    app: postgres-iam
    project: allin1
type: Opaque
data:
  # Placeholder en base64 — reemplazar por valores reales en un archivo
  # postgres-iam-secret.yaml (en .gitignore, NUNCA commitear el real).
  # DEBEN coincidir exactamente con los valores en iam-db-secret.yaml
  # (DB_USER, DB_PASSWORD, DB_NAME) para que iam pueda autenticarse.
  # Generar con: echo -n "valor_real" | base64
  POSTGRES_USER: cG9zdGdyZXM=          # "postgres"
  POSTGRES_PASSWORD: VHVQYXNzd29yZFNlZ3VyYUFxdWkxMjMh # "TuPasswordSeguraAqui123!"
  POSTGRES_DB: aWFtX2Ri                # "iam_db"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-iam-pvc
  namespace: student-aalarcon
  labels:
    app: postgres-iam
    project: allin1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # NOTA: si el cluster no tiene una StorageClass por defecto, este PVC
  # quedará en estado "Pending". Confirmar con el administrador del
  # cluster o agregar aquí: storageClassName: "<nombre>"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-iam
  namespace: student-aalarcon
  labels:
    app: postgres-iam
    project: allin1
spec:
  serviceName: postgres-iam
  replicas: 1
  selector:
    matchLabels:
      app: postgres-iam
  template:
    metadata:
      labels:
        app: postgres-iam
        project: allin1
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-iam-secret
          volumeMounts:
            - name: postgres-iam-data
              mountPath: /var/lib/postgresql/data
              # Evita el error "initdb: directory not empty" que da
              # postgres:alpine cuando el punto de montaje ya tiene
              # el directorio "lost+found" creado por algunos provisioners
              subPath: pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-iam-data
          persistentVolumeClaim:
            claimName: postgres-iam-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-iam
  namespace: student-aalarcon
  labels:
    app: postgres-iam
    project: allin1
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-iam
  clusterIP: None  # Headless service, requerido por el StatefulSet
