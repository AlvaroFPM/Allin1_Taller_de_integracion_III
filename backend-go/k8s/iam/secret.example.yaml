# Copia este archivo como secret.yaml y reemplaza los valores base64
# por las credenciales reales ANTES de aplicar con kubectl.
# secret.yaml está en .gitignore — NUNCA subas credenciales reales al repo.
#
# ==============================================================================
# Secret: iam-db-secret
# ==============================================================================
# ⚠️  IMPORTANTE — VALORES PLACEHOLDER ⚠️
# Los valores de abajo son EJEMPLOS codificados en base64.
# DEBEN ser reemplazados con los valores REALES antes de aplicar
# este manifiesto en el cluster.
#
# Para codificar un valor en base64, usa el siguiente comando:
#
#   echo -n "valor_real" | base64
#
# Ejemplo:
#   echo -n "mi_password_segura" | base64
#   → bWlfcGFzc3dvcmRfc2VndXJh
#
# Luego reemplaza el valor correspondiente en el campo 'data' de abajo.
#
# ⚠️  NUNCA subas este archivo con credenciales reales al repositorio.
# Considera usar un manejador de secretos (Sealed Secrets, Vault, etc.)
# en producción.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  # Nombre del Secret — referenciado desde el Deployment
  name: iam-db-secret
  # Namespace asignado al equipo en el cluster universitario
  namespace: student-apinilla
  labels:
    # Labels consistentes con el resto de recursos del proyecto
    app: iam
    project: allin1
# Opaque: tipo genérico para secretos definidos por el usuario
type: Opaque
data:
  # -----------------------------------------------------------------------
  # Claves que coinciden EXACTAMENTE con las variables de entorno que
  # lee el código Go en internal/database/postgres.go:
  #   os.Getenv("DB_USER"), os.Getenv("DB_PASSWORD"), etc.
  # -----------------------------------------------------------------------

  # DB_USER — Usuario de PostgreSQL
  # Valor placeholder: "postgres" → base64: cG9zdGdyZXM=
  DB_USER: cG9zdGdyZXM=

  # DB_PASSWORD — Contraseña de PostgreSQL
  # Valor placeholder: "cambia_esta_password" → base64: Y2FtYmlhX2VzdGFfcGFzc3dvcmQ=
  DB_PASSWORD: Y2FtYmlhX2VzdGFfcGFzc3dvcmQ=

  # DB_NAME — Nombre de la base de datos
  # Valor placeholder: "iam_db" → base64: aWFtX2Ri
  DB_NAME: aWFtX2Ri

  # DB_SSLMODE — Modo SSL para la conexión a PostgreSQL
  # Valor placeholder: "disable" → base64: ZGlzYWJsZQ==
  DB_SSLMODE: ZGlzYWJsZQ==
