# ==============================================================================
# Ingress: api-gateway
# ==============================================================================
# Este Ingress reemplaza al Ingress `iam`; el clúster solo permite un
# dominio con path /, por eso todo pasa por el gateway.
#
# El tráfico externo llega al dominio configurado, el nginx-ingress
# controller lo recibe y lo redirige al Service api-gateway (Nginx),
# que a su vez enruta internamente a los microservicios (iam, catalog, etc.).
#
# Rutas internas gestionadas por el gateway (ver configmap.yaml):
#   /v1/auth/*    → iam:8080
#   /v1/catalog/* → catalog:8082  (pendiente, comentado)
#
# TLS: No configurado por ahora. Si el cluster tiene cert-manager,
# se puede agregar una sección tls: con un ClusterIssuer de Let's Encrypt.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Nombre del Ingress
  name: api-gateway
  # Namespace asignado al equipo en el cluster universitario
  namespace: student-aalarcon
  labels:
    # Labels consistentes con el resto de recursos del proyecto
    app: api-gateway
    project: allin1
    tier: backend
  annotations:
    # Requerido por la política de admisión del cluster (rke2-edu-ingress-hostname):
    # ExternalDNS solo acepta este target exacto para crear el registro DNS.
    external-dns.alpha.kubernetes.io/target: "proxy.inf.uct.cl"
  # ---------------------------------------------------------------------------
  # NOTA sobre nginx.ingress.kubernetes.io/rewrite-target:
  #
  # NO se incluye la annotation rewrite-target en este Ingress.
  #
  # Motivo: El API Gateway (Nginx) necesita recibir la ruta completa
  # (ej. /v1/auth/login) para poder enrutarla al microservicio correcto
  # según los bloques location del configmap.yaml. Si usáramos
  # rewrite-target: /, nginx-ingress reescribiría la ruta antes de que
  # llegue al gateway, rompiendo el enrutamiento.
  # ---------------------------------------------------------------------------
spec:
  # ingressClassName: Especifica qué Ingress controller maneja este recurso.
  # "nginx" corresponde al nginx-ingress controller estándar del cluster.
  ingressClassName: nginx

  rules:
    # Host: Dominio bajo el cual se expone el API Gateway.
    #
    # IMPORTANTE: el cluster universitario (política de admisión
    # rke2-edu-ingress-hostname) exige el formato "proyecto.dev.censei.cl",
    # usando el namespace del equipo como "proyecto". El formato original
    # documentado (api.<namespace>.estudiantes.dev.censei.cl) fue rechazado
    # por el cluster y tuvo que corregirse.
    - host: student-aalarcon.dev.censei.cl
      http:
        paths:
          # Path: la misma política del cluster exige que cada hostname use
          # EXCLUSIVAMENTE el path "/" (no permite subpaths como /v1/auth).
          # Por eso todo el tráfico hacia este host se enruta al Service del
          # API Gateway, que internamente enruta a cada microservicio según
          # la ruta (ver configmap.yaml).
          - path: /
            pathType: Prefix
            backend:
              service:
                # Nombre del Service del API Gateway
                name: api-gateway
                port:
                  # Puerto del Service (80 → targetPort 8080 en el Pod Nginx)
                  number: 80

  # ---------------------------------------------------------------------------
  # TLS (deshabilitado por ahora)
  # ---------------------------------------------------------------------------
  # Si el cluster tiene cert-manager con un ClusterIssuer configurado,
  # descomentar la sección de abajo para habilitar HTTPS automático:
  #
  # tls:
  #   - hosts:
  #       - student-aalarcon.dev.censei.cl
  #     secretName: iam-tls-cert    # cert-manager creará este Secret automáticamente
  #
  # Y agregar la annotation del issuer:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  # ---------------------------------------------------------------------------