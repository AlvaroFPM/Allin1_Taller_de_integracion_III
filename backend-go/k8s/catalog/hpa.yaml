# ==============================================================================
# HorizontalPodAutoscaler: catalog-hpa
# ==============================================================================
# Escala el Deployment catalog entre 1 y 2 réplicas según uso de CPU.
# El porcentaje se calcula sobre requests.cpu (100m), es decir el umbral
# real de escalado es 60 m de CPU consumidos en promedio por Pod.
# maxReplicas = 2 porque la cuota del namespace student-aalarcon no permite más
# (ResourceQuota requests.memory 1088Mi / limits.memory 2624Mi al límite).
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-hpa
  namespace: student-aalarcon
  labels:
    app: catalog
    project: allin1
    tier: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300

