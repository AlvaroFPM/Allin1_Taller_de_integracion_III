# ==============================================================================
# Secret: catalog-db-secret (Template / Ejemplo)
# ==============================================================================
# Copia este archivo como secret.yaml y reemplaza los valores CHANGE_ME
# por las credenciales reales antes de aplicar con kubectl:
#   kubectl apply -f secret.yaml
#
# ⚠️ ADVERTENCIA:
# secret.yaml DEBE estar en .gitignore — NUNCA comitear secretos reales al repositorio.
#
# Para generar una contraseña segura de PostgreSQL, puedes ejecutar:
#   openssl rand -hex 16
#
# ⚠️ SINCRONIZACIÓN:
# Los valores definidos aquí alimentan tanto al Deployment de Catalog como
# al StatefulSet de postgres-catalog (DB_USER -> POSTGRES_USER,
# DB_PASSWORD -> POSTGRES_PASSWORD, DB_NAME -> POSTGRES_DB).
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-secret
  namespace: student-aalarcon
  labels:
    app: catalog
    project: allin1
    tier: backend
type: Opaque
stringData:
  DB_USER: "CHANGE_ME"
  # Generar password con: openssl rand -hex 16
  DB_PASSWORD: "CHANGE_ME"
  DB_NAME: "CHANGE_ME"
  DB_SSLMODE: "CHANGE_ME"
