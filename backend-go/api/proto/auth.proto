syntax = "proto3";

package auth;

option go_package = "github.com/AlvaroFPM/Allin1_Taller_de_integracion_III/backend-go/internal/api/pb/auth";

import "google/api/annotations.proto";

// AuthService provee métodos para registro, login y perfil.
service AuthService {
  // Register registra a un nuevo usuario en el sistema.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  // Login autentica a un usuario y devuelve un token JWT.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // GetProfile obtiene el perfil del usuario autenticado actual.
  rpc GetProfile(ProfileRequest) returns (ProfileResponse) {
    option (google.api.http) = {
      get: "/v1/auth/profile"
    };
  }

    // UpdateProfile actualiza los datos editables del perfil del usuario autenticado.
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse) {
    option (google.api.http) = {
      put: "/v1/auth/profile"
      body: "*"
    };
  }
}

// Mensajes para el Registro
message RegisterRequest {
  string rut = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string password = 5;
}

message RegisterResponse {
  int64 user_id = 1;
  string message = 2;
  string token = 3;
}

// Mensajes para el Login
message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string message = 2;
}

// Mensajes para obtener el perfil (Profile)
message ProfileRequest {
  // Vacío intencionalmente, tomaremos el ID del JWT en el interceptor o gateway.
}

message ProfileResponse {
  int64 user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string bio_experiencia = 5;
  string telefono = 6;
  string habilidades = 7;
  string ciudad = 8;
  string region = 9;
  string foto_perfil_url = 10;
}

// Mensajes para actualizar el perfil (los campos vacíos reemplazan el valor guardado)
message UpdateProfileRequest {
  string bio_experiencia = 1;
  string telefono = 2;
  string habilidades = 3;
  string ciudad = 4;
  string region = 5;
}